name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --no-restore --verbosity normal
      - name: Publish
        run: |
          ./build-linux.sh
          ./build-windows.sh
          ./build-macos.sh
          mkdir release-artifacts
      - name: Compress
        run: |
          cd WissididomApi/bin/Release/net10.0/linux-x64/publish
          zip -r ../../../../../../release-artifacts/WissididomApi-linux-x64.zip *
          cd ../../../../../..
          cd WissididomApi/bin/Release/net10.0/linux-musl-x64/publish
          zip -r ../../../../../../release-artifacts/WissididomApi-linux-musl-x64.zip *
          cd ../../../../../..
          cd WissididomApi/bin/Release/net10.0/linux-musl-arm64/publish
          zip -r ../../../../../../release-artifacts/WissididomApi-linux-musl-arm64.zip *
          cd ../../../../../..
          cd WissididomApi/bin/Release/net10.0/linux-arm/publish
          zip -r ../../../../../../release-artifacts/WissididomApi-linux-arm.zip *
          cd ../../../../../..
          cd WissididomApi/bin/Release/net10.0/linux-arm64/publish
          zip -r ../../../../../../release-artifacts/WissididomApi-linux-arm64.zip *
          cd ../../../../../..
          cd WissididomApi/bin/Release/net10.0/win-x64/publish
          zip -r ../../../../../../release-artifacts/WissididomApi-win-x64.zip *
          cd ../../../../../..
          cd WissididomApi/bin/Release/net10.0/win-x86/publish
          zip -r ../../../../../../release-artifacts/WissididomApi-win-x86.zip *
          cd ../../../../../..
          cd WissididomApi/bin/Release/net10.0/win-arm64/publish
          zip -r ../../../../../../release-artifacts/WissididomApi-win-arm64.zip *
          cd ../../../../../..
          cd WissididomApi/bin/Release/net10.0/osx-x64/publish
          zip -r ../../../../../../release-artifacts/WissididomApi-macos-x64.zip *
          cd ../../../../../..
          cd WissididomApi/bin/Release/net10.0/osx-arm64/publish
          zip -r ../../../../../../release-artifacts/WissididomApi-macos-arm64.zip *
          cd ../../../../../..
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WissididomApi
          path: release-artifacts
  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # allows for tags access
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        name: Download artifact
        with:
          name: WissididomApi
          path: release-artifacts/
      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          replacesArtifacts: true
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "release-artifacts/*"
          body: ${{ github.event.head_commit.message }}
          prerelease: true
          name: Nightly Release
          tag: nightly-build
      - name: Update nightly-build tag
        run: |
          git tag -f nightly-build
          git push -f origin nightly-build
